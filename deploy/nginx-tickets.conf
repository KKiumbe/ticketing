# /etc/nginx/sites-available/tickets.sikika-ke.co.ke
# Then: ln -s ../sites-available/tickets.sikika-ke.co.ke /etc/nginx/sites-enabled/ && certbot --nginx -d tickets.sikika-ke.co.ke
server {
    listen 80;
    server_name tickets.sikika-ke.co.ke;

    client_max_body_size 1m;

    # API (incl. Safaricom callbacks at /api/v1/pay/...)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health { proxy_pass http://127.0.0.1:4000; }

    # Next.js: sales pages, tickets, admin
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
